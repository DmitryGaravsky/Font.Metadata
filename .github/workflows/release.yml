name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
  DOTNET_NOLOGO: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          ./eng/verify-release-source.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT | Out-Null
          $version = ./eng/get-version.ps1 -Tag $env:RELEASE_TAG
          "version=$version" >> $env:GITHUB_OUTPUT

  verify:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Verify packages and portable CLI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./eng/prepare-release.ps1 -Tag $env:RELEASE_TAG
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/release-tests/*/result.json
          if-no-files-found: warn
      - name: Preserve verified release files
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ needs.version.outputs.version }}
          path: artifacts/release/${{ needs.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 30

  nuget:
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ needs.version.outputs.version }}
          path: artifacts/publish
      - name: Validate publication inputs
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set NUGET_USER in the nuget environment.'
          }
          ./eng/publish-github-release.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -Directory artifacts/publish -CheckOnly
          $missing = foreach ($id in 'Font.Metadata','Font.Metadata.Spdx','Font.Metadata.Tool') {
            $exists = ./eng/check-nuget-package.ps1 -PackageId $id -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT -Directory artifacts/publish
            if (-not $exists) { $id }
          }
          "missing=$($missing -join ',')" >> $env:GITHUB_OUTPUT
      - name: Authenticate to NuGet.org
        if: steps.publication.outputs.missing != ''
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish missing packages in dependency order
        if: steps.publication.outputs.missing != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          MISSING_PACKAGES: ${{ steps.publication.outputs.missing }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          foreach ($id in $env:MISSING_PACKAGES.Split(',')) {
            ./eng/verify-release-source.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT | Out-Null
            dotnet nuget push "artifacts/publish/$id.$env:RELEASE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed for $id." }
          }

  github-release:
    needs: [version, nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ needs.version.outputs.version }}
          path: artifacts/publish
      - name: Attach verified release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: ./eng/publish-github-release.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -Directory artifacts/publish
